name: Record production deployment

# Records a deployment already completed on Cloudflare; does not deploy code.
on:
  push:
    branches: [main]
    paths: [.github/workflows/record-production-deployment.yml]
  workflow_dispatch:
    inputs:
      deployed_sha:
        description: Full commit SHA already deployed and verified on Cloudflare
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: record-production-deployment
  cancel-in-progress: false

jobs:
  record:
    # Bootstrap only from the known deployed commit. Later updates are manual.
    if: >-
      github.repository == 'evanryuu/faysume' && github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       github.event.before == '55f9fbef5d009617bbed4354931902ac9e4dfc98')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      deployments: write
    env:
      SITE_URL: https://faysume.evanryuu.me
      DEPLOYED_SHA: ${{ inputs.deployed_sha || '55f9fbef5d009617bbed4354931902ac9e4dfc98' }}
    steps:
      - name: Check live frontend and backend
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DEPLOYED_SHA" =~ ^[0-9a-f]{40}$ ]]
          # Availability checks do not prove a version; the operator must verify
          # the supplied SHA against the actual Cloudflare deployment first.
          for path in / /materials /settings; do
            curl --fail --silent --show-error --retry 2 --max-time 30 \
              "$SITE_URL$path" | grep -q '<div id="root">'
          done
          curl --fail --silent --show-error --retry 2 --max-time 30 \
            "$SITE_URL/api/config" | jq -e '
              [.configured, .vision, .search, .agent] |
              all(.[]; type == "boolean")' > /dev/null

      - name: Record verified Cloudflare deployment
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          resolved_sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$DEPLOYED_SHA" --jq .sha)
          [[ "$resolved_sha" == "$DEPLOYED_SHA" ]]
          deployment_id=$(gh api --method GET "repos/$GITHUB_REPOSITORY/deployments" \
            -f sha="$DEPLOYED_SHA" -f environment=production --jq '.[0].id // empty')
          if [[ -z "$deployment_id" ]]; then
            deployment_id=$(jq -n --arg sha "$DEPLOYED_SHA" '{
              ref: $sha, auto_merge: false, required_contexts: [],
              environment: "production", production_environment: true,
              description: "Record an existing Cloudflare Workers deployment"
            }' | gh api --method POST "repos/$GITHUB_REPOSITORY/deployments" \
              --input - --jq .id)
          fi
          [[ "$deployment_id" =~ ^[0-9]+$ ]]
          log_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          jq -n --arg url "$SITE_URL" --arg log "$log_url" '{
            state: "success", environment_url: $url, log_url: $log,
            auto_inactive: false,
            description: "Existing Cloudflare deployment verified; frontend and API reachable"
          }' | gh api --method POST \
            "repos/$GITHUB_REPOSITORY/deployments/$deployment_id/statuses" --input - > /dev/null
          printf '### Production\n\n[Open Faysume](%s)\n\nDeployed commit: `%s`\n\nThis workflow records an existing deployment; it does not publish code.\n' \
            "$SITE_URL" "$DEPLOYED_SHA" >> "$GITHUB_STEP_SUMMARY"
